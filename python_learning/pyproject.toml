[tool.pytest.ini_options]
testpaths = ["python_learning"]
python_files = ["test_*.py"]
addopts = "--cov=python_learning --cov-report=html --strict-markers"
markers = [
    "parametrize: mark test to run with multiple parameters"
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
